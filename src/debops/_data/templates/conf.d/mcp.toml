# MCP (Model Context Protocol) server policy for this project.

# The DebOps MCP server ('debops mcp serve') exposes this project to
# LLM agents: inspection tools by default, playbook execution and
# project changes when enabled below. The server is confined to this
# project directory, and every change it makes is committed to git with
# provenance.

[project.mcp]

# The tools to expose, by name: 'allow' restricts the exposed set,
# 'deny' removes from it; the deny list wins. Both are empty by default
# (everything is exposed). See 'debops mcp inspect /path/sock --tools'.
#allow = []
#deny = []

# Extra paths the read tools must not serve, relative to the project
# directory; the built-in deny list (secrets, key material, virtual
# environments) always applies.
#read_deny = []

# Playbook execution: 'none' hides the execution tools, 'check' allows
# check mode only, 'all' allows changing the managed hosts.
execute = "check"

# How long a playbook execution may run before it is killed, in seconds;
# 0 means no limit (the run still ends when the client cancels it).
execute_timeout = 3600

# How long a tool call waits for the project lock — held by a run in
# flight — before it refuses with a busy answer, in seconds; 0 means
# no wait (the refusal comes right away), a negative value waits
# forever.
lock_wait = 0

# The ansible-playbook options an execution may pass through. The
# default set is the safe one: the pattern narrowers plus the
# verification modes, which parse or list and exit without executing
# anything or contacting the hosts.
execute_options = ["limit", "tags", "skip-tags", "syntax-check",
                   "list-hosts", "list-tags", "list-tasks"]

# The execution-shaping options are opt-in — name them explicitly:
# "forks" (a parallel-process count), "force-handlers" (run pending
# handlers immediately), "flush-cache" (flush the local fact cache
# first) and "start-at-task" (skip everything before the named task).
#execute_options = ["limit", "tags", "skip-tags", "syntax-check",
#                   "list-hosts", "list-tags", "list-tasks", "forks"]

# Whether check-mode runs include '--diff'. The diff renders the files
# a template task would write — secrets included — into the tool
# result, which goes to the model. Off by default; the per-host recap
# is the agent-usable answer without it.
execute_diff = false

# Whether the execution tools accept 'debug': true. A debug run adds
# -vv, ANSIBLE_DEBUG and ANSIBLE_KEEP_REMOTE_FILES, and its answer
# prints the task arguments — secrets included (the leak starts before
# the debug verbosity; even -v shows them). Off by default.
#execute_debug = false

# The bootstrap escape hatch: a fresh host may need a different
# connection user for the first bootstrap, before the managed account
# and its SSH key exist. Each key is a glob matched against the
# playbook target — the name without the '.yml' extension, globs like
# 'bootstrap*' work — and the value is the allowed username or list
# of them. The override is the run's default connection user, layered
# on top of the inventory: a host's own ansible_user still takes
# precedence, and with no override the run connects as this UNIX
# account. Passwords are never handled: a host without a key is the
# operator's manual step (ssh-copy-id), the agent learns to wait for
# it.
#execute_user_override = { "bootstrap*" = "root", "scope/python/raw" = "root" }

# The run logs of the executions live in the user's cache directory
# ($XDG_CACHE_HOME/debops/mcp/runs/), one directory per project view;
# a diff or a debug run renders secrets into them, and the files are
# private to the account. These knobs tune the pruning: how many logs
# are kept per view, and the age in seconds after which one is dropped.
#run_logs_keep = 10
#run_logs_max_age = 604800

# Glob allowlists of inventory host patterns the host-query and
# the execution tools may touch; empty means every host is allowed.
#ansible_hosts = []
#execute_hosts = []

# Whether the ad-hoc host tools (ansible.facts, ansible.ping) escalate
# privileges on the remote host by default. The DebOps local facts read
# package and file state, which needs root; without it they degrade to
# false negatives. Playbook runs are not affected (roles escalate in
# their own tasks). The per-call 'become' argument overrides this.
become = false

# Pin the active infrastructure view: the view.switch tool is refused.
# The same pinning is available per server process with the serve
# '--view-lock' option; the two combine. The change is global — all
# connected clients share the active view either way.
#view_lock = false

# Tools which ask the user for confirmation before they run, on clients
# which support it. The confirmation is a courtesy, not a security
# boundary; the 'execute' option above is the boundary.
confirm = ["run", "check", "project.push", "keyring.fetch",
           "environment.set", "environment.unset",
           "collection.require", "collection.remove"]

# Whether playbooks living in the project itself may run with the
# 'check' and 'run' tools. They are agent-writable content: a playbook
# can execute commands on the managed hosts even in check mode
# ('check_mode: no' on a task), so untrusted environments should run
# only the collection content. A check run of a project-local playbook
# asks for confirmation when 'check' is in the 'confirm' list above.
local_playbooks = true

# The server's environment for tool runs comes from
# '.debops/mcp/environment' (plain variables, tracked) and
# '.debops/mcp/.env' (tokens, never committed; 0600). The agent sets
# them with the 'environment.set'/'environment.unset' tools, with
# confirmation per entry (see the 'confirm' option above).

# Ansible Collections are managed with the 'collection.require' /
# 'collection.remove' / 'collection.sync' tools, which edit
# 'ansible/collections/requirements.yml' and install into
# 'ansible/collections/' (never outside of the project). Requiring and
# removing are confirmed by default; synchronizing the committed state
# is not, since it only ever installs what the project committed.

# The hosts the keyring tool may fetch GPG keys from (APT repository
# keys and other trust anchors), as fnmatch globs matched against the
# hostname. The code default is open; the fingerprint pin and the user
# confirmation carry the trust. To close the feature entirely, deny the
# tool above.
keyring_sources = ["keyserver.ubuntu.com", "keybase.io"]

# The paths the write tools ('file.write', 'file.delete',
# 'inventory.spec') may touch, as fnmatch globs. The default covers
# every location the playbook runner resolves: the view's playbooks
# and resources, the shared 'ansible/playbooks/' (including the loose
# roles in its 'roles/'), and the project-root 'playbooks/' of
# established projects.
write_allow = ["resources/**", "playbooks/**", "ansible/playbooks/**",
               "/playbooks/**"]

# Patterns with a leading slash, or prefixed with '.debops/' or
# 'ansible/', are anchored at the project directory instead of the view
# root. To let agents author project skills and prompts (served from
# '.debops/mcp/'), allow them explicitly:
#write_allow = ["resources/**", "playbooks/**", "ansible/playbooks/**",
#               "/playbooks/**",
#               ".debops/mcp/skills/**", ".debops/mcp/prompts/**"]

# Under '.debops/' only the MCP content directories are writable at
# all, so no pattern can open the configuration, the hooks or the
# environment; 'ansible.cfg' is never writable either.

# The 'overrides.write' tool injects files, templates and tasks into
# read-only roles (ansible/overrides/), run on the managed hosts at the
# next playbook execution; it is not registered unless enabled.
overrides = false

# Custom script tools from '.debops/mcp/tools/': executable scripts
# which run as the server's account on the controller, with the
# project as the working directory. They are not registered unless
# enabled, and every call asks the user to confirm.
custom_tools = false

# Additional variable names which environment.set refuses to set, on
# top of the built-in list (PATH, LD_*, PYTHON*, the Ansible code
# paths), which always applies.
#environment_deny = []

# A client which cannot ask for confirmation is refused confirm-gated
# operations (a headless client otherwise gets unconfirmed everything).
# Set this false only for a trusted client which cannot elicit; the
# skip is logged either way.
confirm_required = true

# The minimum interval between git synchronizations with the origin,
# in seconds.
sync_interval = 60

# The write operations refuse to start below this much free disk space,
# in MiB: a git operation which dies mid-write can leave a broken
# repository.
min_free_mb = 64

# Which Ansible Collection content the tools may serve: the bundled
# DebOps collection, and anything else Ansible can see. The project's
# own content is always allowed.
bundled_content = true
external_content = true

# Note: the global kill switch, 'mcp.enabled', is deliberately not read
# from the project configuration; it lives in the system or account
# configuration, written by 'debops mcp disable'.
