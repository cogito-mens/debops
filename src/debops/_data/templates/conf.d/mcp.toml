# MCP (Model Context Protocol) server policy for this project.

# The DebOps MCP server ('debops mcp serve') exposes this project to
# LLM agents: inspection tools by default, playbook execution and
# project changes when enabled below. The server is confined to this
# project directory, and every change it makes is committed to git with
# provenance.

[project.mcp]

# The tools to expose, by name: 'allow' restricts the exposed set,
# 'deny' removes from it; the deny list wins. Both are empty by default
# (everything is exposed). See 'debops mcp inspect /path/sock --tools'.
#allow = []
#deny = []

# Extra paths the read tools must not serve, relative to the project
# directory; the built-in deny list (secrets, key material, virtual
# environments) always applies.
#read_deny = []

# Playbook execution: 'none' hides the execution tools, 'check' allows
# check mode only, 'all' allows changing the managed hosts.
execute = "check"

# How long a playbook execution may run before it is killed, in seconds.
execute_timeout = 3600

# The ansible-playbook options an execution may pass through.
execute_options = ["limit", "tags", "skip-tags"]

# Glob allowlists of inventory host patterns the host-query and
# the execution tools may touch; empty means every host is allowed.
#ansible_hosts = []
#execute_hosts = []

# Tools which ask the user for confirmation before they run, on clients
# which support it. The confirmation is a courtesy, not a security
# boundary; the 'execute' option above is the boundary.
confirm = ["run", "project_push", "keyring_fetch",
           "environment_set", "environment_unset"]

# The server's environment for tool runs comes from
# '.debops/mcp/environment' (plain variables, tracked) and
# '.debops/mcp/.env' (tokens, never committed; 0600). The agent sets
# them with the 'environment_set'/'environment_unset' tools, with
# confirmation per entry (see the 'confirm' option above).

# The hosts the keyring tool may fetch GPG keys from (APT repository
# keys and other trust anchors), as fnmatch globs matched against the
# hostname. The code default is open; the fingerprint pin and the user
# confirmation carry the trust. To close the feature entirely, deny the
# tool above.
keyring_sources = ["keyserver.ubuntu.com", "keybase.io"]

# The paths the write tools ('view_write', 'view_delete',
# 'inventory_spec') may touch, as fnmatch globs. The default covers
# every location the playbook runner resolves: the view's playbooks
# and resources, the shared 'ansible/playbooks/' (including the loose
# roles in its 'roles/'), and the project-root 'playbooks/' of
# established projects.
write_allow = ["resources/**", "playbooks/**", "ansible/playbooks/**",
               "/playbooks/**"]

# Patterns with a leading slash, or prefixed with '.debops/' or
# 'ansible/', are anchored at the project directory instead of the view
# root. To let agents author project skills and prompts (served from
# '.debops/mcp/'), allow them explicitly:
#write_allow = ["resources/**", "playbooks/**", "ansible/playbooks/**",
#               "/playbooks/**",
#               ".debops/mcp/skills/**", ".debops/mcp/prompts/**"]

# Under '.debops/' only the MCP content directories are writable at
# all, so no pattern can open the configuration, the hooks or the
# environment; 'ansible.cfg' is never writable either.

# The 'overrides_write' tool injects files, templates and tasks into
# read-only roles (ansible/overrides/), run on the managed hosts at the
# next playbook execution; it is not registered unless enabled.
overrides = false

# The minimum interval between git synchronizations with the origin,
# in seconds.
sync_interval = 60

# The write operations refuse to start below this much free disk space,
# in MiB: a git operation which dies mid-write can leave a broken
# repository.
min_free_mb = 64

# Which Ansible Collection content the tools may serve: the bundled
# DebOps collection, and anything else Ansible can see. The project's
# own content is always allowed.
bundled_content = true
external_content = true

# Note: the global kill switch, 'mcp.enabled', is deliberately not read
# from the project configuration; it lives in the system or account
# configuration, written by 'debops mcp disable'.
